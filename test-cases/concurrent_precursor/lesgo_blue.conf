! Compact velocity-only BLUE consumer configuration. It receives the RED
! velocity planes through CPS; neither domain applies pressure-gradient forcing.

DOMAIN {
  nproc = 1
  Nx = 64
  Ny = 64
  Nz = 64
  z_i = 126.0
  Lx = 2.0
  Ly = 2.0
  Lz = 2.0
  uniform_spacing = .false.
}

MODEL {
  sgs_model = 5
  wall_damp_exp = 2
  cs_count = 5
  dyn_init = 100
  Co = 0.16
  ifilter = 1
  u_star = 1.0
  vonk = 0.4
  sgs = .true.
  molec = .false.
  nu_molec = 1.14e-5
}

CORIOLIS {
  coriolis_forcing = 0
  fc = 0.0001
  G = 8.0
  alpha = 0.0
}

TIME {
  nsteps = 30
  runtime = -1
  use_cfl_dt = .true.
  cfl = 0.0625
  dt = 2.0e-4
  cumulative_time = .false.
}

FLOW_COND {
  lbc_mom = 0
  ubc_mom = 0
  ubot = 0.0
  utop = 0.0
  use_sponge = .false.
  sponge_frequency = 3.9
  sponge_height = 1.5
  zo = 0.0001
  inflow_type = 4
  fringe_region_end = 1.0
  fringe_region_len = 0.125
  sampling_region_end = 0.625
  inflow_velocity = 1.0
  use_mean_p_force = .false.
  eval_mean_p_force = .false.
  mean_p_force_x = 1.0
  mean_p_force_y = 0.0
  use_random_force = .false.
}

OUTPUT {
  wbase = 10
  nenergy = 10
  lag_cfl_count = 1000
  checkpoint_data = .false.
  tavg_calc = .false.
  point_calc = .false.
  domain_calc = .false.
  xplane_calc = .false.
  yplane_calc = .false.
  zplane_calc = .false.
}
