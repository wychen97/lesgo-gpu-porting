! Compact active-scalar example. Temperature variations feed back into the
! momentum equation through buoyancy.

DOMAIN {
  nproc = 1
  Nx = 64
  Ny = 64
  Nz = 64
  z_i = 126.0
  Lx = 2.0
  Ly = 2.0
  Lz = 2.0
  uniform_spacing = .false.
}

MODEL {
  sgs_model = 5
  wall_damp_exp = 2
  cs_count = 5
  dyn_init = 100
  Co = 0.16
  ifilter = 1
  u_star = 1.0
  vonk = 0.4
  sgs = .true.
  molec = .false.
  nu_molec = 1.14e-5
}

CORIOLIS {
  coriolis_forcing = 0
  fc = 0.0001
  G = 8.0
  alpha = 0.0
}

TIME {
  nsteps = 40
  runtime = -1
  use_cfl_dt = .true.
  cfl = 0.0625
  dt = 2.0e-4
  cumulative_time = .false.
}

FLOW_COND {
  lbc_mom = 1
  ubc_mom = 0
  ubot = 0.0
  utop = 0.0
  use_sponge = .false.
  sponge_frequency = 3.9
  sponge_height = 1.5
  zo = 0.0001
  inflow_type = 1
  fringe_region_end = 1.0
  fringe_region_len = 0.125
  inflow_velocity = 1.0
  use_mean_p_force = .false.
  eval_mean_p_force = .false.
  mean_p_force_x = 1.0
  mean_p_force_y = 0.0
  use_random_force = .false.
}

OUTPUT {
  wbase = 10
  nenergy = 10
  lag_cfl_count = 1000
  checkpoint_data = .false.
  tavg_calc = .false.
  point_calc = .false.
  domain_calc = .false.
  xplane_calc = .false.
  yplane_calc = .false.
  zplane_calc = .false.
}

SCALARS {
  lbc_scal = 0
  scal_bot = 300.0
  flux_bot = 0.0
  read_lbc_scal = .false.
  lapse_rate = 0.0
  ic_z = 0.0, 252.0
  ic_theta = 300.0, 301.0
  ic_no_vel_noise_z = 0.0
  g = 9.81
  zo_s = 0.00001
  T_scale = 300.0
  passive_scalar = .false.
  Pr_sgs = 0.4
}
